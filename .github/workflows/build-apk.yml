name: Profit calculator Android APK
on:
  push:
    branches:
      - profit-calculator-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kalkulyator_pribyli_V1_3.apk
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulyator_pribyli_V1_3
          path: Kalkulyator_pribyli_V1_3.apk
          if-no-files-found: error
